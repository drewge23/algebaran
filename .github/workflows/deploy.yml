name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm install`, not `npm ci`: the lockfile is generated on macOS and npm
      # omits other platforms' optional binaries (lightningcss/rolldown), which
      # breaks the Linux build. `install` re-resolves them for this platform.
      - run: npm install --no-audit --no-fund

      # Gate the deploy on the same checks used locally.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Project sites are served from /<repo>/, so the bundle needs that base.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
